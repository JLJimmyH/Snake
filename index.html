<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7719aa">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>筆記 MVP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <span class="sb-brand">📒 我的筆記</span>
      <button id="sb-close" class="icon-btn only-mobile" aria-label="關閉側欄">✕</button>
    </div>
    <div id="tree"></div>
    <button id="add-root" class="sb-add">＋ 新增頁面</button>
  </aside>
  <div id="scrim"></div>

  <main id="main">
    <header id="topbar">
      <button id="sb-toggle" class="icon-btn" aria-label="切換側欄">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="title-wrap">
        <div id="crumbs"></div>
        <input id="page-title" placeholder="未命名" autocomplete="off">
      </div>
      <span id="save-state"></span>
    </header>

    <div id="toolbar" data-tool="select">
      <div class="tb-group">
        <button class="tbtn tool" data-tool="select" title="選取 / 移動 (V)">
          <svg class="i" viewBox="0 0 24 24"><path d="M5 3l6 17 2.5-7.5L21 10z"/></svg>
        </button>
        <button class="tbtn tool" data-tool="lasso" title="套索選取 (L)">
          <svg class="i" viewBox="0 0 24 24"><path d="M7 22a5 5 0 01-2-4"/><path d="M3.3 14A6.8 6.8 0 012 10c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8a12 12 0 01-5-1"/><circle cx="5" cy="16" r="2"/></svg>
        </button>
        <button class="tbtn tool" data-tool="pen" title="筆 (P)">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="tbtn tool" data-tool="hl" title="螢光筆 (H)">
          <svg class="i" viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"/></svg>
        </button>
        <button class="tbtn tool" data-tool="eraser" title="橡皮擦 (E)">
          <svg class="i" viewBox="0 0 24 24"><path d="M7 21l-4.3-4.3a1 1 0 010-1.4l10-10a1 1 0 011.4 0l5.6 5.6a1 1 0 010 1.4L11 21"/><path d="M22 21H7"/><path d="M5 11l9 9"/></svg>
        </button>
        <button class="tbtn tool" data-tool="text" title="文字 (T)">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
        </button>
        <button class="tbtn" id="btn-image" title="插入圖片">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-3.1-3.1a2 2 0 00-2.8 0L6 21"/></svg>
        </button>
      </div>

      <div class="tb-group opts" data-for="pen">
        <span class="tb-sep"></span>
        <button class="swatch active" data-color="#1f2937" style="--c:#1f2937"></button>
        <button class="swatch" data-color="#2563eb" style="--c:#2563eb"></button>
        <button class="swatch" data-color="#dc2626" style="--c:#dc2626"></button>
        <button class="swatch" data-color="#16a34a" style="--c:#16a34a"></button>
        <button class="swatch" data-color="#7719aa" style="--c:#7719aa"></button>
        <button class="wbtn" data-width="1.5"><i style="--w:3px"></i></button>
        <button class="wbtn active" data-width="3"><i style="--w:6px"></i></button>
        <button class="wbtn" data-width="6"><i style="--w:10px"></i></button>
      </div>

      <div class="tb-group opts" data-for="hl">
        <span class="tb-sep"></span>
        <button class="swatch active" data-color="#fde047" style="--c:#fde047"></button>
        <button class="swatch" data-color="#86efac" style="--c:#86efac"></button>
        <button class="swatch" data-color="#f9a8d4" style="--c:#f9a8d4"></button>
        <button class="swatch" data-color="#93c5fd" style="--c:#93c5fd"></button>
        <button class="wbtn" data-width="12"><i style="--w:6px"></i></button>
        <button class="wbtn active" data-width="20"><i style="--w:10px"></i></button>
        <button class="wbtn" data-width="32"><i style="--w:14px"></i></button>
      </div>

      <div class="tb-group opts" data-for="eraser">
        <span class="tb-sep"></span>
        <button class="chip mode on" data-mode="partial" title="只擦掉碰到的部分">局部</button>
        <button class="chip mode" data-mode="stroke" title="碰到就擦掉整條筆跡">整條</button>
        <button class="wbtn" data-width="6"><i style="--w:6px"></i></button>
        <button class="wbtn active" data-width="12"><i style="--w:10px"></i></button>
        <button class="wbtn" data-width="24"><i style="--w:16px"></i></button>
      </div>

      <div class="tb-group">
        <span class="tb-sep"></span>
        <button class="tbtn" id="btn-undo" title="復原 (Ctrl+Z)" disabled>
          <svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
        </button>
        <button class="tbtn" id="btn-redo" title="重做 (Ctrl+Y)" disabled>
          <svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg>
        </button>
        <button class="tbtn" id="btn-del" title="刪除選取 (Delete)" disabled>
          <svg class="i" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
        <span class="tb-sep"></span>
        <button class="chip" id="btn-finger" title="單指觸控要書寫還是移動畫面"></button>
        <button class="chip" id="zoom" title="回到 100%">100%</button>
      </div>
    </div>

    <div id="viewport" data-tool="select"></div>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </main>
</div>

<div id="menu" hidden></div>
<div id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
